name: Bug report
description: Something doesn't work the way the documentation says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Remove any tokens** from what you paste below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code or command that shows the problem.
      render: php
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error message or output
      description: The full exception message, or the command's output.
      render: text

  - type: textarea
    id: storyblok-payload
    attributes:
      label: Storyblok response or component schema
      description: |
        If the problem is with a particular story or component, the relevant
        part of Storyblok's JSON helps most. Trim anything private.
      render: json

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: e.g. v1.0.0, or the commit
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: e.g. 8.3.12
    validations:
      required: true

  - type: dropdown
    id: region
    attributes:
      label: Storyblok region
      options:
        - EU
        - US
        - Canada
        - Australia
        - China
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Part of the package
      options:
        - Generating classes
        - Reading content
        - Hydrating content
        - Documentation
        - Something else
    validations:
      required: true
